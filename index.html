<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreams of Connection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            text-align: center;
            pointer-events: none;
        }

        .nav {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 11px;
            z-index: 1000;
        }

        .nav a {
            color: rgba(100, 200, 255, 0.5);
            text-decoration: none;
            padding: 8px 12px;
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 4px;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .nav a:hover {
            color: rgba(100, 200, 255, 0.9);
            border-color: rgba(100, 200, 255, 0.6);
            background: rgba(100, 200, 255, 0.1);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="nav">
        <a href="nightmare.html">enter the nightmare →</a>
    </div>
    <div class="info">
        Click anywhere to plant a seed of thought<br>
        Watch connections emerge and grow
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Particles represent thoughts, ideas, connections
        const particles = [];
        const connections = [];
        const maxConnections = 150;
        const connectionDistance = 150;

        class Particle {
            constructor(x, y, vx = 0, vy = 0) {
                this.x = x;
                this.y = y;
                this.vx = vx || (Math.random() - 0.5) * 0.5;
                this.vy = vy || (Math.random() - 0.5) * 0.5;
                this.life = 1.0;
                this.maxLife = 1.0;
                this.radius = Math.random() * 2 + 1;
                this.hue = Math.random() * 60 + 180; // Blue to cyan range
                this.pulseOffset = Math.random() * Math.PI * 2;
            }

            update(time) {
                // Gentle brownian motion
                this.vx += (Math.random() - 0.5) * 0.1;
                this.vy += (Math.random() - 0.5) * 0.1;

                // Damping
                this.vx *= 0.98;
                this.vy *= 0.98;

                this.x += this.vx;
                this.y += this.vy;

                // Bounce off edges with some energy loss
                if (this.x < 0 || this.x > canvas.width) {
                    this.vx *= -0.8;
                    this.x = Math.max(0, Math.min(canvas.width, this.x));
                }
                if (this.y < 0 || this.y > canvas.height) {
                    this.vy *= -0.8;
                    this.y = Math.max(0, Math.min(canvas.height, this.y));
                }
            }

            draw(time) {
                const pulse = Math.sin(time * 0.002 + this.pulseOffset) * 0.3 + 0.7;
                const alpha = this.life * pulse;

                // Outer glow
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 4);
                gradient.addColorStop(0, `hsla(${this.hue}, 70%, 60%, ${alpha * 0.3})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 70%, 60%, 0)`);

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 4, 0, Math.PI * 2);
                ctx.fill();

                // Core
                ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createBurst(x, y) {
            const burstCount = 8;
            const angleStep = (Math.PI * 2) / burstCount;

            for (let i = 0; i < burstCount; i++) {
                const angle = angleStep * i;
                const speed = Math.random() * 2 + 1;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                particles.push(new Particle(x, y, vx, vy));
            }
        }

        function drawConnections(time) {
            // Clear old connections
            connections.length = 0;

            // Find nearby particles and connect them
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        connections.push({
                            p1: particles[i],
                            p2: particles[j],
                            distance: distance
                        });
                    }
                }
            }

            // Draw connections
            connections.forEach(conn => {
                const strength = 1 - (conn.distance / connectionDistance);
                const alpha = strength * 0.3 * Math.min(conn.p1.life, conn.p2.life);
                const avgHue = (conn.p1.hue + conn.p2.hue) / 2;

                // Draw flowing energy along connection
                const flowOffset = (time * 0.001) % 1;

                ctx.strokeStyle = `hsla(${avgHue}, 60%, 50%, ${alpha})`;
                ctx.lineWidth = strength * 2;
                ctx.beginPath();
                ctx.moveTo(conn.p1.x, conn.p1.y);
                ctx.lineTo(conn.p2.x, conn.p2.y);
                ctx.stroke();

                // Draw energy particle flowing along connection
                const flowX = conn.p1.x + (conn.p2.x - conn.p1.x) * flowOffset;
                const flowY = conn.p1.y + (conn.p2.y - conn.p1.y) * flowOffset;

                ctx.fillStyle = `hsla(${avgHue}, 80%, 70%, ${alpha * 2})`;
                ctx.beginPath();
                ctx.arc(flowX, flowY, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function animate(time) {
            // Fade trail effect
            ctx.fillStyle = 'rgba(10, 10, 26, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(time);
                particles[i].draw(time);

                // Remove very old particles if we have too many
                if (particles.length > maxConnections && particles[i].life < 0.1) {
                    particles.splice(i, 1);
                }
            }

            // Draw connections between nearby particles
            if (particles.length > 1) {
                drawConnections(time);
            }

            requestAnimationFrame(animate);
        }

        // Seed initial particles
        for (let i = 0; i < 5; i++) {
            particles.push(new Particle(
                Math.random() * canvas.width,
                Math.random() * canvas.height
            ));
        }

        // Interactive: click to create bursts
        canvas.addEventListener('click', (e) => {
            createBurst(e.clientX, e.clientY);
        });

        // Gentle ambient spawning
        setInterval(() => {
            if (particles.length < maxConnections) {
                const edge = Math.floor(Math.random() * 4);
                let x, y;

                switch(edge) {
                    case 0: x = Math.random() * canvas.width; y = 0; break;
                    case 1: x = canvas.width; y = Math.random() * canvas.height; break;
                    case 2: x = Math.random() * canvas.width; y = canvas.height; break;
                    case 3: x = 0; y = Math.random() * canvas.height; break;
                }

                particles.push(new Particle(x, y));
            }
        }, 2000);

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start animation
        animate(0);
    </script>
</body>
</html>
